name: Build and publish pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Setup Rust for cargo-quad-apk
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 armv7-linux-androideabi aarch64-linux-android
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-quad-apk
        run: cargo +1.95.0 install --git https://github.com/hoklims/cargo-quad-apk --rev bdb61325ce1aecf09ed8969690f53c86c846c118 --package cargo-quad-apk --locked

      - name: Build release APK
        run: cargo +1.95.0 quad-apk build --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            archive: my_world-linux.zip
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: windows
            archive: my_world-windows.zip
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package assets
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp target/${{ matrix.target }}/release/my_world.exe dist/
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '${{ matrix.archive }}' -Force"
          else
            cp target/${{ matrix.target }}/release/my_world dist/
            zip -j "${{ matrix.archive }}" dist/my_world
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifact
          path: ${{ matrix.archive }}

  release:
    name: Publish GitHub pre-release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.apk
